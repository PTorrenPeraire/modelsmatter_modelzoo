[tool.poetry]
name = "SSBenchmark"
version = "0.2.0"
description = ""
authors = ["PTorrenPeraire <ptorrenp@gmail.com>"]

[tool.poetry.group.main.dependencies]
python = ">=3.9,<3.11"
pandas = "^1.4.1"
rdchiral = "^1.1.0"
tqdm = "^4.63.1"
numpy = "^1.22.3"
typing-extensions = "^4.1.1"
jupyterlab = "^3.3.4"
ConfigArgParse = "^1.5.3"
waitress = "^2.1.2"
PyYAML = "^6.0"
registry-factory = "^0.1.2"

[tool.poetry.group.chemformer]
optional = true

[tool.poetry.group.chemformer.dependencies]
torch = "1.12"
pytorch-lightning = "1.2.3"
pysmilesutils = {git = "https://github.com/MolecularAI/pysmilesutils.git"}
pytest-order = "^1.0.1"
torchvision = "^0.12.0"
optuna = "^2.10.0"
fairscale = "0.3.1"
deepspeed = "0.3.12"
tensorboard = "^2.9.1"


[tool.poetry.group.mhn_react]
optional = true

[tool.poetry.group.mhn_react.dependencies]
swifter = "^1.1.3"
scikit-learn = "^1.0.2"
hydra-core = "^1.1.1"
torchvision = "^0.12.0"
wandb = "^0.12.18"
Flask = "^2.1.3"


[tool.poetry.group.localretro]
optional = true

[tool.poetry.group.localretro.dependencies]
dgllife = "^0.2.9"
dgl = "*"


[tool.poetry.dev-dependencies]
pytest = "^6.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
